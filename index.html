<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHOPFLOW-UPDATE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --secondary: #1a1a2e;
        --accent: #f59e0b;
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --text: #1e293b;
        --text-secondary: #64748b;
        --success: #10b981;
        --danger: #ef4444;
        --border: #e2e8f0;
        --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        --shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.12);
        --radius: 8px;
        --radius-sm: 4px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "IBM Plex Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        min-height: 100vh;
      }

      h1,
      h2,
      h3,
      h4 {
        font-family: "DM Sans", sans-serif;
        font-weight: 600;
      }

      /* Header */
      .header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 64px;
        background: var(--card-bg);
        box-shadow: var(--shadow);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 32px;
      }

      .logo {
        font-family: "DM Sans", sans-serif;
        font-size: 24px;
        font-weight: 700;
        color: var(--secondary);
        cursor: pointer;
        text-decoration: none;
      }

      .logo span {
        color: var(--accent);
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 32px;
      }

      .nav-item {
        font-size: 14px;
        font-weight: 500;
        color: var(--text-secondary);
        cursor: pointer;
        transition: color 0.2s;
        text-decoration: none;
        position: relative;
      }

      .nav-item:hover,
      .nav-item.active {
        color: var(--primary);
      }

      .nav-item.active::after {
        content: "";
        position: absolute;
        bottom: -4px;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--primary);
        border-radius: 1px;
      }

      .cart-btn {
        position: relative;
        padding: 8px 16px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: var(--radius);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
      }

      .cart-btn:hover {
        background: var(--primary-dark);
      }

      .cart-badge {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 20px;
        height: 20px;
        background: var(--accent);
        color: white;
        font-size: 11px;
        font-weight: 600;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Main Content */
      .main {
        padding-top: 64px;
        min-height: 100vh;
      }

      .view {
        display: none;
        animation: fadeIn 0.3s ease;
      }

      .view.active {
        display: block;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Home View */
      .carousel {
        position: relative;
        height: 360px;
        overflow: hidden;
        background: var(--secondary);
      }

      .carousel-slide {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.6s ease;
      }

      .carousel-slide.active {
        opacity: 1;
      }

      .carousel-slide:nth-child(1) {
        background: linear-gradient(135deg, #1a1a2e 0%, #2563eb 100%);
      }

      .carousel-slide:nth-child(2) {
        background: linear-gradient(135deg, #1e3a5f 0%, #10b981 100%);
      }

      .carousel-slide:nth-child(3) {
        background: linear-gradient(135deg, #3b1a2e 0%, #f59e0b 100%);
      }

      .carousel-content {
        text-align: center;
        color: white;
        padding: 32px;
      }

      .carousel-content h1 {
        font-size: 42px;
        margin-bottom: 12px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
      }

      .carousel-content p {
        font-size: 18px;
        opacity: 0.9;
        margin-bottom: 24px;
      }

      .carousel-content .btn {
        display: inline-block;
        padding: 12px 32px;
        background: white;
        color: var(--text);
        border: none;
        border-radius: var(--radius);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s;
      }

      .carousel-content .btn:hover {
        transform: scale(1.05);
      }

      .carousel-dots {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
      }

      .carousel-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.4);
        cursor: pointer;
        transition: all 0.3s;
      }

      .carousel-dot.active {
        background: white;
        width: 32px;
        border-radius: 5px;
      }

      /* Categories */
      .categories {
        padding: 24px 32px;
        display: flex;
        gap: 12px;
        overflow-x: auto;
        background: var(--card-bg);
        border-bottom: 1px solid var(--border);
      }

      .category-pill {
        padding: 8px 20px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--card-bg);
        font-size: 14px;
        font-weight: 500;
        color: var(--text-secondary);
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.2s;
      }

      .category-pill:hover {
        border-color: var(--primary);
        color: var(--primary);
      }

      .category-pill.active {
        background: var(--primary);
        border-color: var(--primary);
        color: white;
      }

      /* Products Grid */
      .products-section {
        padding: 32px;
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
      }

      .section-title {
        font-size: 20px;
        color: var(--text);
      }

      .carousel-controls {
        display: flex;
        gap: 8px;
      }

      .carousel-control {
        width: 36px;
        height: 36px;
        border: 1px solid var(--border);
        background: var(--card-bg);
        border-radius: var(--radius);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        font-size: 16px;
        color: var(--text-secondary);
      }

      .carousel-control:hover {
        border-color: var(--primary);
        color: var(--primary);
      }

      .carousel-control:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .products-carousel-wrapper {
        position: relative;
        overflow: hidden;
      }

      .products-carousel {
        display: flex;
        gap: 24px;
        transition: transform 0.4s ease;
        width: max-content;
      }

      .products-carousel .product-card {
        flex-shrink: 0;
        width: 280px;
      }

      @media (max-width: 600px) {
        .products-carousel .product-card {
          width: 240px;
        }
        .header {
          padding: 0 16px;
        }
        .products-section,
        .categories {
          padding: 16px;
        }
        .carousel {
          height: 280px;
        }
        .carousel-content h1 {
          font-size: 28px;
        }
        .section-header {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }
      }

      .product-card {
        background: var(--card-bg);
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: var(--shadow);
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .product-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-hover);
      }

      .product-image {
        width: 100%;
        height: 200px;
        object-fit: cover;
        background: #f1f5f9;
      }

      .product-info {
        padding: 16px;
      }

      .product-title {
        font-size: 14px;
        font-weight: 500;
        color: var(--text);
        margin-bottom: 8px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        height: 42px;
      }

      .product-rating {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-bottom: 8px;
      }

      .stars {
        color: var(--accent);
        font-size: 12px;
      }

      .rating-count {
        font-size: 12px;
        color: var(--text-secondary);
      }

      .product-price {
        font-size: 18px;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 12px;
      }

      .add-to-cart-btn {
        width: 100%;
        padding: 10px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
      }

      .add-to-cart-btn:hover {
        background: var(--primary-dark);
      }

      .product-card-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .product-card-actions .quantity-selector {
        display: none;
        flex: 1;
        gap: 4px;
        margin-bottom: 0;
      }

      .product-card-actions .quantity-selector.show {
        display: flex;
      }

      .product-card-actions .quantity-btn {
        width: 24px;
        height: 24px;
        font-size: 14px;
        padding: 0;
      }

      .product-card-actions .quantity-input {
        width: 36px;
        height: 24px;
        font-size: 12px;
        padding: 0;
      }

      .add-to-cart-btn.adding {
        display: none;
      }

      .product-card-actions .add-to-cart-btn.adding {
        display: block;
        flex: 1;
      }

      .product-card-actions .cancel-btn {
        display: block;
        flex: 1;
        background: var(--text-secondary);
      }

      .product-card-actions .cancel-btn:hover {
        background: var(--text);
      }

      .product-card-actions .add-btn {
        display: block;
      }

      .product-card-actions .add-btn.hide {
        display: none;
      }

      /* Product Detail View */
      .detail-view {
        padding: 32px;
        max-width: 1200px;
        margin: 0 auto;
      }

      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-size: 14px;
        color: var(--text-secondary);
        cursor: pointer;
        margin-bottom: 24px;
        transition: all 0.2s;
      }

      .back-btn:hover {
        border-color: var(--primary);
        color: var(--primary);
      }

      .detail-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 48px;
        background: var(--card-bg);
        border-radius: var(--radius);
        padding: 32px;
        box-shadow: var(--shadow);
      }

      @media (max-width: 900px) {
        .detail-container {
          grid-template-columns: 1fr;
          gap: 24px;
        }
      }

      .detail-image {
        width: 100%;
        height: 400px;
        object-fit: cover;
        border-radius: var(--radius);
        background: #f1f5f9;
      }

      .detail-content h1 {
        font-size: 24px;
        margin-bottom: 12px;
      }

      .detail-price {
        font-size: 28px;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 16px;
      }

      .detail-rating {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 20px;
      }

      .detail-description {
        color: var(--text-secondary);
        margin-bottom: 24px;
        line-height: 1.8;
      }

      .spec-section {
        margin-bottom: 24px;
      }

      .spec-label {
        font-size: 14px;
        font-weight: 500;
        color: var(--text);
        margin-bottom: 8px;
      }

      .spec-options {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .spec-option {
        padding: 8px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--card-bg);
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .spec-option:hover {
        border-color: var(--primary);
      }

      .spec-option.selected {
        background: var(--primary);
        border-color: var(--primary);
        color: white;
      }

      .quantity-selector {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }

      .quantity-btn {
        width: 36px;
        height: 36px;
        border: 1px solid var(--border);
        background: var(--card-bg);
        border-radius: var(--radius-sm);
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }

      .quantity-btn:hover:not(:disabled) {
        border-color: var(--primary);
        color: var(--primary);
      }

      .quantity-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .quantity-input {
        width: 60px;
        height: 36px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        text-align: center;
        font-size: 14px;
      }

      .detail-add-btn {
        width: 100%;
        padding: 16px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: var(--radius);
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }

      .detail-add-btn:hover {
        background: var(--primary-dark);
      }

      .detail-add-btn:disabled {
        background: var(--text-secondary);
        cursor: not-allowed;
      }

      .stock-info {
        font-size: 13px;
        color: var(--text-secondary);
        margin-top: 12px;
      }

      .stock-info.low {
        color: var(--danger);
      }

      /* Cart View */
      .cart-view {
        padding: 32px;
        max-width: 1000px;
        margin: 0 auto;
      }

      .cart-title {
        font-size: 24px;
        margin-bottom: 24px;
      }

      .cart-empty {
        text-align: center;
        padding: 64px;
        background: var(--card-bg);
        border-radius: var(--radius);
      }

      .cart-empty-icon {
        font-size: 64px;
        margin-bottom: 16px;
        opacity: 0.3;
      }

      .cart-empty h3 {
        font-size: 18px;
        margin-bottom: 8px;
      }

      .cart-empty p {
        color: var(--text-secondary);
        margin-bottom: 24px;
      }

      .cart-empty .btn {
        display: inline-block;
        padding: 12px 24px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: var(--radius);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }

      .cart-content {
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 24px;
      }

      @media (max-width: 800px) {
        .cart-content {
          grid-template-columns: 1fr;
        }
      }

      .cart-items {
        background: var(--card-bg);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .cart-item {
        display: grid;
        grid-template-columns: 80px 1fr auto auto;
        gap: 16px;
        align-items: center;
        padding: 16px;
        border-bottom: 1px solid var(--border);
      }

      .cart-item:last-child {
        border-bottom: none;
      }

      @media (max-width: 600px) {
        .cart-item {
          grid-template-columns: 60px 1fr;
          gap: 12px;
        }
        .cart-item-quantity,
        .cart-item-total {
          grid-column: 2;
        }
      }

      .cart-item-image {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: var(--radius-sm);
        background: #f1f5f9;
      }

      .cart-item-info h4 {
        font-size: 14px;
        margin-bottom: 4px;
      }

      .cart-item-specs {
        font-size: 12px;
        color: var(--text-secondary);
      }

      .cart-item-quantity {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .cart-item-quantity .quantity-btn {
        width: 28px;
        height: 28px;
        font-size: 14px;
      }

      .cart-item-quantity .quantity-input {
        width: 48px;
        height: 28px;
        font-size: 13px;
      }

      .cart-item-total {
        font-size: 16px;
        font-weight: 600;
        color: var(--primary);
        min-width: 80px;
        text-align: right;
      }

      .remove-btn {
        width: 32px;
        height: 32px;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        border-radius: var(--radius-sm);
        transition: all 0.2s;
      }

      .remove-btn:hover {
        background: #fef2f2;
        color: var(--danger);
      }

      .cart-summary {
        background: var(--card-bg);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 24px;
        height: fit-content;
        position: sticky;
        top: 88px;
      }

      .cart-summary h3 {
        font-size: 16px;
        margin-bottom: 16px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
      }

      .summary-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
        font-size: 14px;
      }

      .summary-row.total {
        font-size: 18px;
        font-weight: 600;
        padding-top: 12px;
        border-top: 1px solid var(--border);
        margin-top: 12px;
      }

      .checkout-btn {
        width: 100%;
        padding: 14px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: var(--radius);
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 16px;
        transition: background 0.2s;
      }

      .checkout-btn:hover {
        background: var(--primary-dark);
      }

      /* Toast */
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: var(--secondary);
        color: white;
        padding: 12px 24px;
        border-radius: var(--radius);
        font-size: 14px;
        box-shadow: var(--shadow-hover);
        z-index: 2000;
        opacity: 0;
        transition: all 0.3s ease;
      }

      .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }

      .toast.success {
        background: var(--success);
      }

      /* Footer */
      .footer {
        background: var(--secondary);
        color: rgba(255, 255, 255, 0.6);
        text-align: center;
        padding: 16px;
        font-size: 13px;
        margin-top: auto;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <a href="#home" class="logo">Shop<span>Flow</span></a>
      <nav class="nav">
        <a href="#home" class="nav-item active" data-view="home">首页</a>
        <a href="#cart" class="nav-item cart-link" data-view="cart">
          购物车
          <span class="cart-badge" id="cartBadge">0</span>
        </a>
      </nav>
    </header>

    <main class="main">
      <!-- Home View -->
      <div id="homeView" class="view active">
        <div class="carousel">
          <div class="carousel-slide active">
            <div class="carousel-content">
              <h1>新品上市</h1>
              <p>探索最新科技产品，享受限时优惠</p>
              <button class="btn" onclick="filterCategory('Electronics')">
                立即选购
              </button>
            </div>
          </div>
          <div class="carousel-slide">
            <div class="carousel-content">
              <h1>时尚穿搭</h1>
              <p>精选潮流服饰，展现你的风格</p>
              <button class="btn" onclick="filterCategory('Clothing')">
                查看详情
              </button>
            </div>
          </div>
          <div class="carousel-slide">
            <div class="carousel-content">
              <h1>家居精选</h1>
              <p>打造舒适温馨的家居环境</p>
              <button class="btn" onclick="filterCategory('Home')">
                去看看
              </button>
            </div>
          </div>
          <div class="carousel-dots">
            <div class="carousel-dot active" data-index="0"></div>
            <div class="carousel-dot" data-index="1"></div>
            <div class="carousel-dot" data-index="2"></div>
          </div>
        </div>

        <div class="categories">
          <div class="category-pill active" data-category="all">全部</div>
          <div class="category-pill" data-category="Electronics">电子数码</div>
          <div class="category-pill" data-category="Clothing">服装鞋帽</div>
          <div class="category-pill" data-category="Home">家居用品</div>
          <div class="category-pill" data-category="Sports">运动户外</div>
          <div class="category-pill" data-category="Books">图书音像</div>
        </div>

        <section class="products-section">
          <div class="section-header">
            <h2 class="section-title">热门商品</h2>
            <div class="carousel-controls">
              <button
                class="carousel-control"
                id="prevProducts"
                onclick="scrollProducts(-1)"
              >
                ←
              </button>
              <button
                class="carousel-control"
                id="nextProducts"
                onclick="scrollProducts(1)"
              >

      function handleRoute() {
        const hash = window.location.hash;
        const navItems = document.querySelectorAll(".nav-item");

        if (hash.startsWith("#product/")) {
          const id = parseInt(hash.split("/")[1]);
          const product = products.find((p) => p.id === id);
          if (product) {
            showProductDetail(product);
            navigateTo("detail");

        } else if (hash === "#cart") {
          navigateTo("cart");
          renderCart();
        } else {
          navigateTo("home");
        }

        const views = ["homeView", "detailView", "cartView"];
        views.forEach((v) =>
          document.getElementById(v).classList.remove("active"),
        );

        const targetView = document.getElementById(view + "View");
        if (targetView) {
          targetView.classList.add("active");
        }

        document.querySelectorAll(".nav-item").forEach((item) => {
          item.classList.remove("active");
          if (item.dataset.view === view) {
            item.classList.add("active");
          }
        });

        window.scrollTo(0, 0);
      }

      function calculateProductsPerView() {
        const width = window.innerWidth;
        if (width <= 600) return 1;
        if (width <= 900) return 2;
        if (width <= 1200) return 3;
        return 4;
      }

        const carousel = document.getElementById("productsCarousel");

          filter === "all"
            ? products

        productsPerView = calculateProductsPerView();

        carousel.innerHTML = filtered
          .map((product) => {
            const qty = productQuantities[product.id] || 1;
            return `
                <div class="product-card" onclick="viewProduct(${product.id})">
                    <img src="${product.image}" alt="${product.name}" class="product-image" loading="lazy">
                    <div class="product-info">
                        <h3 class="product-title">${product.name}</h3>
                        <div class="product-rating">

                        </div>

          .join("");

        updateCarouselControls(filtered.length);

        document.getElementById("prevProducts").disabled =
          productCarouselIndex <= 0;
        document.getElementById("nextProducts").disabled =
          productCarouselIndex >= maxIndex;

          currentCategory === "all"
            ? products
            : products.filter((p) => p.category === currentCategory);

        productCarouselIndex = Math.max(
          0,
          Math.min(maxIndex, productCarouselIndex + direction),
        );

        const cardWidth = 280 + 24;
        const offset = -productCarouselIndex * cardWidth;

        document.getElementById("productsCarousel").style.transform =
          `translateX(${offset}px)`;
        updateCarouselControls(filtered.length);
      }

      function renderProducts(filter = "all") {
        const carousel = document.getElementById("productsCarousel");
        const filtered =
          filter === "all"
            ? products
            : products.filter((p) => p.category === filter);

        productsPerView = calculateProductsPerView();

          productCarouselIndex <= 0;

          productCarouselIndex >= maxIndex;

      function scrollProducts(direction) {

          currentCategory === "all"

      function viewProduct(id) {
        window.location.hash = `#product/${id}`;
      }

      function filterCategory(category) {
        currentCategory = category;
        productCarouselIndex = 0;
        document.getElementById("productsCarousel").style.transform =
          "translateX(0)";
        document.querySelectorAll(".category-pill").forEach((pill) => {
          pill.classList.toggle("active", pill.dataset.category === category);
        });
        renderProducts(category);
      }

      function showQuantitySelector(productId) {
        productQuantities[productId] = 1;
        renderProducts(currentCategory);
      }

      function changeProductQuantity(productId, delta) {
        const product = products.find((p) => p.id === productId);
        const currentQty = productQuantities[productId] || 1;
        const newQty = currentQty + delta;
        if (newQty >= 1 && newQty <= product.stock) {
          productQuantities[productId] = newQty;
          renderProducts(currentCategory);
        }
      }

      function addToCartFromCard(productId) {
        const product = products.find((p) => p.id === productId);
        const quantity = productQuantities[productId] || 1;
        addToCart(product, quantity);
        delete productQuantities[productId];
        renderProducts(currentCategory);
      }

      function cancelQuantitySelector(productId) {
        delete productQuantities[productId];
        renderProducts(currentCategory);
      }

      function quickAddToCart(id) {
        const product = products.find((p) => p.id === id);
        addToCart(product, 1);
      }

      // Product Detail
      function showProductDetail(product) {
        selectedProduct = product;
        selectedColor = product.specs.colors[0] || null;
        selectedSize = product.specs.sizes[0] || null;
        selectedQuantity = 1;

        const container = document.getElementById("detailContainer");
        container.innerHTML = `
                <div>
                    <img src="${product.image}" alt="${product.name}" class="detail-image">

                <div class="detail-content">

                    <div class="detail-price">¥${product.price.toLocaleString()}</div>
                    <div class="detail-rating">
                        <span class="stars">★ ★ ★ ★ ★</span>
                        <span>${product.rating} (${product.reviews} 条评价)</span>
                    </div>
                    <p class="detail-description">${product.description}</p>
                    
                    ${
                      product.specs.colors.length > 0
                        ? `
                        <div class="spec-section">
                            <div class="spec-label">颜色</div>
                            <div class="spec-options">
                                ${product.specs.colors
                                  .map(
                                    (c) => `
                                    <button class="spec-option ${c === selectedColor ? "selected" : ""}" 
                                        onclick="selectSpec('color', '${c}')">${c}</button>
                                `,
                                  )
                                  .join("")}
                            </div>
                        </div>
                    `
                        : ""
                    }
                    
                    ${
                      product.specs.sizes.length > 0
                        ? `
                        <div class="spec-section">
                            <div class="spec-label">规格</div>
                            <div class="spec-options">
                                ${product.specs.sizes
                                  .map(
                                    (s) => `
                                    <button class="spec-option ${s === selectedSize ? "selected" : ""}" 
                                        onclick="selectSpec('size', '${s}')">${s}</button>
                                `,
                                  )
                                  .join("")}
                            </div>
                        </div>
                    `
                        : ""
                    }
                    
                    <div class="quantity-selector">
                        <span class="spec-label">数量</span>
                        <button class="quantity-btn" onclick="changeQuantity(-1)" ${selectedQuantity <= 1 ? "disabled" : ""}>−</button>
                        <input type="number" class="quantity-input" value="${selectedQuantity}" readonly>
                        <button class="quantity-btn" onclick="changeQuantity(1)" ${selectedQuantity >= product.stock ? "disabled" : ""}>+</button>
                    </div>
                    
                    <button class="detail-add-btn" onclick="addCurrentToCart()" ${product.stock === 0 ? "disabled" : ""}>
                        ${product.stock === 0 ? "缺货" : "加入购物车"}
                    </button>
                    
                    <div class="stock-info ${product.stock < 20 ? "low" : ""}">
                        ${product.stock < 20 ? `库存紧张，仅剩 ${product.stock} 件` : `库存充足 (${product.stock} 件)`}
                    </div>
                </div>
            `;
      }

      function selectSpec(type, value) {
        if (type === "color") {
          selectedColor = value;
        } else {
          selectedSize = value;
        }

        const container = document.getElementById("detailContainer");
        const specSections = container.querySelectorAll(".spec-section");

        if (type === "color" && specSections[0]) {
          const buttons = specSections[0].querySelectorAll(".spec-option");
          buttons.forEach((btn) => {
            btn.classList.toggle("selected", btn.textContent === value);
          });
        } else if (type === "size" && specSections[1]) {
          const buttons = specSections[1].querySelectorAll(".spec-option");
          buttons.forEach((btn) => {
            btn.classList.toggle("selected", btn.textContent === value);
          });
        }
      }

      function changeQuantity(delta) {
        const newQty = selectedQuantity + delta;
        if (newQty >= 1 && newQty <= selectedProduct.stock) {
          selectedQuantity = newQty;
          const input = document.querySelector(".quantity-input");
          const minusBtn = document.querySelector(
            ".quantity-btn:first-of-type",
          );
          const plusBtn = document.querySelector(".quantity-btn:last-of-type");

          input.value = newQty;
          minusBtn.disabled = newQty <= 1;
          plusBtn.disabled = newQty >= selectedProduct.stock;
        }
      }

      function addCurrentToCart() {
        addToCart(
          selectedProduct,
          selectedQuantity,
          selectedColor,
          selectedSize,
        );
      }

      // Cart
      function addToCart(product, quantity, color = null, size = null) {
        const existingIndex = cart.findIndex(
          (item) =>
            item.id === product.id &&
            item.color === color &&
            item.size === size,
        );

        if (existingIndex > -1) {
          cart[existingIndex].quantity += quantity;
        } else {
          cart.push({
            id: product.id,
            name: product.name,
            price: product.price,
            image: product.image,
            color: color || "-",
            size: size || "-",
            quantity: quantity,
          });
        }

        saveCart();
        updateCartBadge();
        showToast(`已添加 ${quantity} 件商品到购物车`, "success");
      }

      function saveCart() {
        localStorage.setItem("shopflow_cart", JSON.stringify(cart));
      }

      function updateCartBadge() {
        const badge = document.getElementById("cartBadge");
        const count = cart.reduce((sum, item) => sum + item.quantity, 0);
        badge.textContent = count;
        badge.style.display = count > 0 ? "flex" : "none";
      }

      function renderCart() {
        const content = document.getElementById("cartContent");

        if (cart.length === 0) {
          content.innerHTML = `

          (sum, item) => sum + item.price * item.quantity,
          0,
        );

        content.innerHTML = `

                            (item, index) => `

                                    <button class="quantity-btn" onclick="updateCartQuantity(${index}, -1)" ${item.quantity <= 1 ? "disabled" : ""}>−</button>

                                <div class="cart-item-total">¥${(item.price * item.quantity).toLocaleString()}</div>
                                <button class="remove-btn" onclick="removeFromCart(${index})">✕</button>
                            </div>
                        `,
                          )
                          .join("")}

                    <div class="cart-summary">
                        <h3>订单摘要</h3>
                        <div class="summary-row">

                            <span>¥${subtotal.toLocaleString()}</span>
                        </div>
                        <button class="checkout-btn" onclick="checkout()">结算</button>
                    </div>
                </div>
            `;
      }

      function updateCartQuantity(index, delta) {
        const newQty = cart[index].quantity + delta;
        if (newQty < 1) return;

        cart[index].quantity = newQty;
        saveCart();
        updateCartBadge();
        renderCart();
      }

      function removeFromCart(index) {
        cart.splice(index, 1);
        saveCart();
        updateCartBadge();
        renderCart();
        showToast("已从购物车移除");
      }

      function checkout() {
        const subtotal = cart.reduce(
          (sum, item) => sum + item.price * item.quantity,
          0,
        );
        alert(
          `感谢您的购买！\n\n订单总额: ¥${subtotal.toLocaleString()}\n\n我们将尽快为您处理订单。`,
        );
        cart = [];
        saveCart();
        updateCartBadge();
        renderCart();
        navigateTo("home");
        window.location.hash = "";
      }

      // Carousel
      function initCarousel() {
        const dots = document.querySelectorAll(".carousel-dot");

        dots.forEach((dot) => {
          dot.addEventListener("click", () => {
            goToSlide(parseInt(dot.dataset.index));
          });
        });

        slideInterval = setInterval(() => {
          currentSlide = (currentSlide + 1) % 3;
          updateSlide();
        }, 4000);
      }

      function goToSlide(index) {
        currentSlide = index;
        updateSlide();
        clearInterval(slideInterval);
        slideInterval = setInterval(() => {
          currentSlide = (currentSlide + 1) % 3;
          updateSlide();
        }, 4000);
      }

      function updateSlide() {
        document.querySelectorAll(".carousel-slide").forEach((slide, i) => {
          slide.classList.toggle("active", i === currentSlide);
        });
        document.querySelectorAll(".carousel-dot").forEach((dot, i) => {
          dot.classList.toggle("active", i === currentSlide);
        });
      }

      // Categories
      function initCategoryFilter() {
        document.querySelectorAll(".category-pill").forEach((pill) => {
          pill.addEventListener("click", () => {
            filterCategory(pill.dataset.category);
          });
        });
      }

      // Toast
      function showToast(message, type = "") {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.className = "toast" + (type ? " " + type : "");
        toast.classList.add("show");

        setTimeout(() => {
          toast.classList.remove("show");
        }, 2500);
      }
    </script>
  </body>
</html>
